name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e . -r requirements/test.txt
      - run: python -m pytest -q
      - run: python scripts/verify_evidence.py
      - run: python scripts/verify_retrieval.py
      - run: python scripts/verify_session.py
      - run: python scripts/verify_service.py
  retrieval:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      TF_USE_LEGACY_KERAS: '1'
      TF_NUM_INTRAOP_THREADS: '2'
      TF_NUM_INTEROP_THREADS: '1'
      OMP_NUM_THREADS: '2'
      TF_ENABLE_ONEDNN_OPTS: '0'
      TF_CPP_MIN_LOG_LEVEL: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements/retrieval.txt
      - run: python -m pip install -e . -r requirements/test.txt -r requirements/retrieval.txt
      - run: python -m pytest -q --disable-warnings
      - run: python scripts/verify_evidence.py
      - run: python scripts/verify_retrieval.py
      - run: python scripts/verify_session.py
      - run: python scripts/verify_service.py
  service:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
        env:
          POSTGRES_USER: portfolio_news
          POSTGRES_PASSWORD: authored-ci-password
          POSTGRES_DB: portfolio_news_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portfolio_news -d portfolio_news_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:8.2.3-alpine@sha256:08ad0b1d280850169a790dba1393ff7a90aef951fc19632cf4d3ce4f78e679ba
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      NEWS_TEST_DATABASE_URL: postgresql://portfolio_news:authored-ci-password@127.0.0.1:5432/portfolio_news_test
      NEWS_REDIS_URL: redis://127.0.0.1:6379/0
      TF_USE_LEGACY_KERAS: '1'
      TF_NUM_INTRAOP_THREADS: '2'
      TF_NUM_INTEROP_THREADS: '1'
      OMP_NUM_THREADS: '2'
      TF_ENABLE_ONEDNN_OPTS: '0'
      TF_CPP_MIN_LOG_LEVEL: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements/service*.txt
      - run: python -m pip install -e . -r requirements/test.txt -r requirements/service.txt
      - run: python -m pip check
      - run: python -m pytest -q --disable-warnings
      - run: python scripts/verify_evidence.py
      - run: python scripts/verify_retrieval.py
      - run: python scripts/verify_session.py
      - run: python scripts/verify_service.py
